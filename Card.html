<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: aliceblue;
        }

        h3 {
            text-align: center;
            font-size: 30px;
            margin: 0;
            padding-top: 10px;
        }

        .ProductCard {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            justify-content: center;
            align-items: center;
            margin: 50px 0;
        }

        .content {
            width: 300px;
            margin: 15px;
            box-sizing: border-box;
            text-align: center;
            border-radius: 20px;
            cursor: pointer;
            padding: 10px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.25),
                        0 3px 6px rgba(0,0,0,0.22);
            transition: 0.4s;
            background: aliceblue;
        }

        .content:hover {
            box-shadow: 0 3px 6px rgba(0,0,0,0.16),
                        0 3px 6px rgba(0,0,0,0.23);
            transform: translate(0px, -8px);
        }

        img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            text-align: center;
            margin: 0 auto;
            display: block;
            border-radius: 5px;
        }

        p {
            text-align: center;
            color: black;
            padding: 0 8px;
        }

        h6 {
            font-size: 26px;
            text-align: center;
            color: black;
            margin: 0;
        }

        .add-to-cart {
            background-color: black;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }

        .add-to-cart:hover {
            background-color: gray;
        }

    </style>
</head>

<body>

    <div class="ProductCard">

        <div class="content">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRz7u2LimzBSIWN0iJEbPltF03Ae744WJYuwuuQYbpv9Q&s=10">

            <h3>UNISEX SUNGLASSES</h3>

            <p>
                This can be worn by both genders.
            </p>

            <h6>Rs 800</h6>

            <button class="add-to-cart">
                Add to Cart
            </button>
            

        </div>

    

        <div class="content">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrvucNyk0pIN8pd1vFgCNL6XH7vdcggCLX1mE1ihsR3A&s=10" >

            <h3>MENS SUNGLASSES</h3>

            <p>
                FOR MEN ONLY
            </p>

            <h6>Rs 1500</h6>

            <button class="add-to-cart">
                Add to Cart
            </button>
            

        </div>

    </div>

</body>
</html>
